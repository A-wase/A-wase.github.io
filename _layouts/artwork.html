---
layout: default
---

<article class="artwork">

  <header class="artwork-header">
    <p class="post-date">
      {{ page.date | date: "%d %B %Y" }}
    </p>

    <h1>{{ page.title }}</h1>
  </header>

  {% if page.image %}
    <img class="artwork-image"
         src="{{ page.image | relative_url }}"
         alt="{{ page.title }}">
  {% endif %}

  <div class="artwork-description">
    {{ content }}
  </div>

</article>
